[tools]
# formatters
shfmt = "latest"
taplo = "latest"
"cargo:stylua" = "latest"
"npm:prettier" = "latest"

# linters
markdownlint-cli2 = "latest"
"cargo:selene" = "latest"
"pipx:yamllint" = "latest"

[tasks."format:markdown"]
description = "Format Markdown files"
run = "prettier --write \"**/*.{md,markdown}\""

[tasks."lint:markdown"]
description = "Lint Markdown files"
run = "markdownlint-cli2 \"**/*.{md,markdown}\""

[tasks."format:toml"]
description = "Format TOML files"
run = "taplo fmt"

[tasks."format:yaml"]
description = "Format YAML files"
run = "prettier --write \"**/*.{yaml,yml}\""

[tasks."lint:yaml"]
description = "Lint YAML files"
run = "yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable}}' ."

[tasks."format:lua"]
description = "Format Lua files"
run = "stylua ."

[tasks."lint:lua"]
description = "Lint Lua files"
run = "selene dot_config/nvim"

[tasks.format]
description = "Run formatters"
depends = ["format:markdown", "format:toml", "format:yaml", "format:lua"]

[tasks.lint]
description = "Run linters"
depends = ["lint:markdown", "lint:yaml", "lint:lua"]

[tasks."test:harness"]
description = "Verify Codex harness docs and metadata"
run = "uv run python scripts/verify-codex-harness.py"

[tasks.test]
description = "Run tests"
depends = ["test:harness"]
