[tools]
# formatters
shfmt = "latest"
taplo = "latest"
"cargo:stylua" = "latest"
"npm:prettier" = "latest"

# linters
markdownlint-cli2 = "latest"
"cargo:selene" = "latest"
"pipx:yamllint" = "latest"

[tasks."format:markdown"]
description = "Format Markdown files"
run = "prettier --write \"**/*.{md,markdown}\""

[tasks."lint:markdown"]
description = "Lint Markdown files"
run = "markdownlint-cli2 \"**/*.{md,markdown}\""

[tasks."format:toml"]
description = "Format TOML files"
run = "taplo fmt"

[tasks."lint:toml"]
description = "Lint TOML files"
run = "taplo lint --colors never"

[tasks."format:yaml"]
description = "Format YAML files"
run = "prettier --write \"**/*.{yaml,yml}\""

[tasks."lint:yaml"]
description = "Lint YAML files"
run = "yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable}}' ."

[tasks."format:shell"]
description = "Format shell files"
run = "shfmt -w dot_zshenv dot_config/zsh/dot_zshenv dot_config/zsh/dot_zprofile dot_config/zsh/dot_zshrc dot_config/zsh/functions.zsh dot_config/zsh/aliases.zsh"

[tasks."format:json"]
description = "Format JSON files"
run = "prettier --write \".markdownlint.jsonc\""

[tasks."format:lua"]
description = "Format Lua files"
run = "stylua ."

[tasks."lint:lua"]
description = "Lint Lua files"
run = "selene dot_config/nvim"

[tasks.format]
description = "Run formatters"
depends = [
  "format:markdown",
  "format:toml",
  "format:yaml",
  "format:shell",
  "format:json",
  "format:lua",
]

[tasks.lint]
description = "Run linters"
depends = ["lint:markdown", "lint:yaml", "lint:lua", "lint:toml"]

[tasks."test:nvim-load"]
description = "Verify Neovim core config loads without plugin bootstrap"
run = "nvim --cmd 'set runtimepath^=dot_config/nvim' -u dot_config/nvim/init.lua -i NONE --headless '+qall!'"

[tasks."test:nvim-load".env]
CHEZMOI_NVIM_SKIP_LAZY = "1"
XDG_CACHE_HOME = ".cache/nvim/cache"
XDG_DATA_HOME = ".cache/nvim/data"
XDG_STATE_HOME = ".cache/nvim/state"

[tasks.test]
description = "Run tests"
depends = ["test:nvim-load"]
