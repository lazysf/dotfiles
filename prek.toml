# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]
# stages を書かない hook は全 stage で走り、commit-msg の段でも二重に走るため。
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "mixed-line-ending"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = '\.(md|markdown)$'

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-identifiers"
name = "check-identifiers"
language = "script"
entry = "scripts/check-identifiers.sh"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "check-ps1-bom"
name = "check-ps1-bom"
language = "script"
entry = "scripts/check-ps1-bom.sh"
files = '\.ps1$'

[[repos.hooks]]
id = "check-commit-msg"
name = "check-commit-msg"
language = "script"
entry = "scripts/check-commit-msg.sh"
stages = ["commit-msg"]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.2"

[[repos.hooks]]
id = "rumdl-check"
args = ["--fix"]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.10.0"

[[repos.hooks]]
id = "tombi-format"
exclude = '^uv\.lock$'

[[repos.hooks]]
id = "tombi-lint"
exclude = '^uv\.lock$'
